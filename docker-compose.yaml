services:
  gateway:
    image: ghcr.io/arnochenfx/rovloom:${ROVLOOM_VERSION:-latest}
    command: [gateway]
    networks: [rovloom]
    ports:
      - "9443:9443" # Connector 设备通道（远程 Connector 经此连接；公网请前置 TLS 反代）
      - "127.0.0.1:9444:9444" # MCP：只发布到宿主机回环，远程客户端经宿主机 HTTPS 反代，无需公网 URL 配置
      - "127.0.0.1:9445:9445" # 管理页：只发布到宿主机回环
    init: true # Bun 作为 PID 1 时补一个 init 收割 schema Worker 等子进程僵尸
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - gateway-config:/home/rovloom/.config/rovloom
      - gateway-data:/home/rovloom/.local/share/rovloom
    environment:
      # 只供 healthcheck 跟随端口；改监听端口仍走 gateway.json
      ROVLOOM_HEALTH_PORT: "${ROVLOOM_MCP_PORT:-9444}"
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    pids_limit: 256

networks:
  rovloom:
    driver: bridge

volumes:
  gateway-config:
  gateway-data:
