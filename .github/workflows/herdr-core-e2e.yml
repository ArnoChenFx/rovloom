# herdr-core 的 Linux 端到端：私有 XDG 沙箱里运行上游当前发布的最新版官方 core（握手不设版本限制，CI 不钉具体版本），真实配对、5 个读取，
# 再验控制档（开关关闭时拒绝 → 打开后 send/读回/blocked/三元组/kill/rm）与计划重启、SIGKILL 后的重新附着；
# 最后用同机转发代理和 0755 socket 目录验证身份失败关闭。
name: herdr-core e2e
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: herdr-core-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        run: bun --no-env-file scripts/ci/e2e-plan.mjs herdr-core
  herdr-core:
    name: herdr-core (latest core)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Download the latest official herdr-core from the release manifest
        env:
          CORE_DIR: ${{ runner.temp }}/core
        run: |
          set -eu
          mkdir -p "$CORE_DIR/latest"
          # 只测上游当前发布的最新版：latest.json 给出版本号、linux-x86_64 压缩包地址与 SHA-256，不在仓库里钉版本。
          # 摘要与压缩包来自同一站点，只能挡传输损坏，不防上游被篡改；上游发新版时这里自动跟进。
          curl -fsS --connect-timeout 15 --max-time 60 https://releases.herdr.dev/core/latest.json -o "$CORE_DIR/latest.json"
          mapfile -t latest < <(python3 -I -c 'import json,sys; m=json.load(open(sys.argv[1])); t=m["targets"]["linux-x86_64"]; print(m["version"]); print(t["url"]); print(t["sha256"])' "$CORE_DIR/latest.json")
          case "${latest[1]}" in
            https://releases.herdr.dev/core/*) ;;
            *) echo "unexpected download host" >&2; exit 1 ;;
          esac
          curl -fsS --connect-timeout 15 --max-time 300 "${latest[1]}" -o "$CORE_DIR/latest.tgz"
          echo "${latest[2]}  $CORE_DIR/latest.tgz" | sha256sum --check
          tar -xzf "$CORE_DIR/latest.tgz" -C "$CORE_DIR/latest"
          test "$("$CORE_DIR/latest/herdr-core" --version | awk '{print $2}')" = "${latest[0]}"
          echo "testing herdr-core ${latest[0]}"
      - name: Build actual standalone product
        run: bun --no-env-file run release:build
      - name: Pair, discover, control a real herdr-core and reattach after restarts
        env:
          CORE_DIR: ${{ runner.temp }}/core
        run: |
          python3 e2e/quickstart.py \
            --binary dist/release/bun-linux-x64/candidate/rovloom \
            --herdr-core "$CORE_DIR/latest/herdr-core" \
            --work "${{ runner.temp }}/hc-work" \
            --then "bun --no-env-file e2e/herdr-core-session.mjs"
  result:
    name: herdr-core acceptance
    if: always()
    needs: [changes, herdr-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Fail closed unless the selected acceptance ran and passed
        run: |
          python3 -c 'import json,os,sys; r=json.loads(os.environ["RESULTS"]); s=r["changes"]["outputs"]["run"]=="true";           sys.exit("herdr-core e2e plan failed") if r["changes"]["result"]!="success" else None;           sys.exit("herdr-core acceptance did not succeed") if s and r["herdr-core"]["result"]!="success" else None;           print("herdr-core acceptance passed" if s else "no relevant changes")'
