# 发布后人工触发：从真实公开 Release 下载八平台二进制和 npm 包 tarball，按 SHA256SUMS 校验并运行 --version；不构建、不写仓库。
name: Verify published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, for example v0.2.0-preview.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: linux-x64
          - runner: ubuntu-24.04
            suffix: linux-x64-musl
            alpine: '1'
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64-musl
            alpine: '1'
          - runner: macos-15-intel
            suffix: darwin-x64
          - runner: macos-15
            suffix: darwin-arm64
          - runner: windows-2025
            suffix: windows-x64.exe
          - runner: windows-11-arm
            suffix: windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download from the real release, verify SHA256SUMS, run --version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid tag"; exit 1; }
          version=${TAG#v}
          asset="rovloom-$version-$SUFFIX"
          base="https://github.com/ArnoChenFx/rovloom/releases/download/$TAG"
          mkdir "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 90 --retry 2 --retry-connrefused --retry-max-time 180 -o SHA256SUMS "$base/SHA256SUMS"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 90 --retry 2 --retry-connrefused --retry-max-time 180 -o "$asset" "$base/$asset"
          expected=$(awk -v name="$asset" '$2 == name || $2 == "*" name { print $1 }' SHA256SUMS)
          [ -n "$expected" ] || { echo "asset missing from SHA256SUMS"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then actual=$(sha256sum "$asset" | awk '{print $1}'); else actual=$(shasum -a 256 "$asset" | awk '{print $1}'); fi
          [ "$expected" = "$actual" ] || { echo "checksum mismatch"; exit 1; }
          chmod +x "$asset"
          if [[ "${{ matrix.alpine }}" == '1' ]]; then
            # musl 产物无法在 glibc runner 上执行：在 Alpine 内先装 libstdc++，再运行下载到的原字节。
            # 只在容器内合并产品输出；Docker 拉取日志与 apk 诊断留在宿主 stderr。
            out=$(docker run --rm -v "$PWD:/work" -w /work -e ASSET="$asset" alpine:3.20 \
              sh -c 'apk add --no-cache libstdc++ >/dev/null && exec "./$ASSET" --version 2>&1' | tr -d '\r')
          else
            out=$("./$asset" --version 2>&1 | tr -d '\r')
          fi
          echo "$out"
          [ "$out" = "Rovloom $version" ] || { echo "unexpected version output"; exit 1; }
  npm-package:
    # 已安装 Bun 的用户路径：校验 tarball 摘要后，按文档用法从 Release 地址 bun add / bunx。
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify the tarball checksum, install it from the release URL, run it
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid tag"; exit 1; }
          version=${TAG#v}
          asset="rovloom-$version.tgz"
          base="https://github.com/ArnoChenFx/rovloom/releases/download/$TAG"
          mkdir "$RUNNER_TEMP/npm"
          cd "$RUNNER_TEMP/npm"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 90 --retry 2 --retry-connrefused --retry-max-time 180 -o SHA256SUMS "$base/SHA256SUMS"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 90 --retry 2 --retry-connrefused --retry-max-time 180 -o "$asset" "$base/$asset"
          expected=$(awk -v name="$asset" '$2 == name || $2 == "*" name { print $1 }' SHA256SUMS)
          [ -n "$expected" ] || { echo "tarball missing from SHA256SUMS"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then actual=$(sha256sum "$asset" | awk '{print $1}'); else actual=$(shasum -a 256 "$asset" | awk '{print $1}'); fi
          [ "$expected" = "$actual" ] || { echo "checksum mismatch"; exit 1; }
          mkdir project
          cd project
          echo '{"name":"verify","private":true}' > package.json
          bun add "$base/$asset"
          out=$(bunx rovloom --version 2>&1 | tr -d '\r')
          echo "$out"
          [ "$out" = "Rovloom $version" ] || { echo "unexpected version output"; exit 1; }
          # Silence only bunx installation diagnostics; the CLI output and exit status remain checked.
          out=$(bunx --silent --package "$base/$asset" rovloom --version 2>&1 | tr -d '\r')
          [ "$out" = "Rovloom $version" ] || { echo "unexpected bunx output"; exit 1; }
  install-latest:
    # install.sh / install.ps1 只跟随官方 latest 稳定版；预发行不会被它们选中，这里验证稳定安装路径本身。
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh scripts/install.sh --install-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/rovloom" --version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/install.ps1 -InstallDir "$env:RUNNER_TEMP\bin"
          & "$env:RUNNER_TEMP\bin\rovloom.exe" --version
