# 本机编译和执行单文件设施探针；只有已接入真实入口时才上传 CLI 预览候选，不发布 Release。
name: Standalone candidates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: standalone-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
permissions:
  contents: read
jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          matrix = {"include": json.loads(Path("scripts/release/platforms.json").read_text())}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix) + "\n")
          PY
  native:
    timeout-minutes: 30
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Check service lifecycle models and native definition parsing without installing services
        shell: bash
        run: |
          set -o pipefail
          bun --no-env-file test ./test/service/macos-host.test.ts ./test/service/platform-probe.test.ts ./test/service/runner-lifecycle.test.ts ./test/service/manager.test.ts ./test/service/command.test.ts ./test/service/windows-control.test.ts ./test/cli/service-host.test.ts ./test/cli/service-runtime.test.ts 2>&1 | tee "$RUNNER_TEMP/test-phases.log"
      - name: Exercise user installers with isolated downloads and native replacement
        run: bun --no-env-file test ./test/release/install.test.mjs
      - name: Exercise Windows product Gateway and omitted-Worker rejection before candidate build
        if: runner.os == 'Windows'
        run: bun --no-env-file test ./test/release/gateway-smoke.test.mjs ./test/release/publication.test.mjs
      - name: Compile and run isolated packaging probe, including omitted-Worker rejection
        run: bun --no-env-file test ./test/release/executable.test.mjs
      - name: Verify actual Windows PE icon and console subsystem
        if: runner.os == 'Windows'
        run: python scripts/release/verify-windows-icon.py dist/release/${{ matrix.target }}/probe/packaging-probe.exe
      - name: Build and accept the musl product inside an Alpine container
        # musl 产物在 glibc runner 上编得出来但跑不起来；构建与全部运行验收都只在 alpine 容器内进行。
        if: matrix.libc == 'musl'
        id: musl
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(bun --no-env-file -p 'JSON.parse(await Bun.file("package.json").text()).version')"
          # 容器内先 apk add libstdc++（musl 产物的 NEEDED 依赖），再跑 --version 与真实 Gateway。
          # TARGET 已由 matrix 提供，release:build 据此编译 musl 目标而不是宿主 glibc 目标。
          ROVLOOM_MUSL_ALPINE=1 bun --no-env-file run release:build
          ROVLOOM_MUSL_ALPINE=1 bun --no-env-file run release:smoke "$PWD/dist/release/$TARGET/candidate/rovloom"
          ROVLOOM_MUSL_ALPINE=1 bun --no-env-file scripts/release/product-smoke.mjs "$PWD/dist/release/$TARGET/candidate/rovloom" "$version"
          echo 'present=true' >> "$GITHUB_OUTPUT"
      - name: Build and smoke the existing product CLI when present
        id: product
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.libc }}" == 'musl' ]]; then
            echo 'musl target accepted inside Alpine; native CLI smoke is not applicable.'
            echo 'present=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -f src/cli/main.ts && -f src/connector/luvus/contract/compiler-worker.ts ]]; then
            bun --no-env-file run release:build
            extension=''
            if [[ "$RUNNER_OS" == Windows ]]; then extension='.exe'; fi
            bun --no-env-file run release:smoke "$PWD/dist/release/$TARGET/candidate/rovloom$extension"
            if [[ "$RUNNER_OS" == Windows ]]; then
              python scripts/release/verify-windows-icon.py "dist/release/$TARGET/candidate/rovloom.exe"
            fi
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'CLI product wiring pending; only the packaging probe was accepted.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify real service lifecycle in disposable hosted VM with explicit OS authorization
        if: steps.product.outputs.present == 'true' && matrix.libc != 'musl'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ROVLOOM_NATIVE_SERVICE_CI: '1'
        run: |
          set -euo pipefail
          extension=''
          if [[ "$RUNNER_OS" == Windows ]]; then extension='.exe'; fi
          export ROVLOOM_SERVICE_EXECUTABLE="dist/release/$TARGET/candidate/rovloom$extension"
          bun --no-env-file scripts/service/native-smoke.mjs 2>&1 | tee -a "$RUNNER_TEMP/test-phases.log"
      - name: Accept real standalone Gateway and explicit unsupported native roles
        # musl 目标已在 Alpine 容器步骤内完成 Gateway 验收。
        if: matrix.target != 'bun-linux-x64' && matrix.libc != 'musl'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          extension=''
          if [[ "$RUNNER_OS" == Windows ]]; then extension='.exe'; fi
          version="$(bun --no-env-file -p 'JSON.parse(await Bun.file("package.json").text()).version')"
          bun --no-env-file scripts/release/product-smoke.mjs "$PWD/dist/release/$TARGET/candidate/rovloom$extension" "$version"
      - name: Accept same product Gateway and Connector with official native Herdr ping
        if: matrix.target == 'bun-linux-x64'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 022
          version="$(bun --no-env-file -p 'JSON.parse(await Bun.file("package.json").text()).version')"
          bun --no-env-file scripts/release/product-smoke.mjs "$PWD/dist/release/$TARGET/candidate/rovloom" "$version"
      - name: Upload packaging probe evidence
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: packaging-probe-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/release/${{ matrix.target }}/probe/packaging-probe*
            dist/release/${{ matrix.target }}/probe/manifest.json
            dist/release/${{ matrix.target }}/probe/rovloom.ico
      - name: Compile and execute the real schema Worker when present
        id: native
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f src/connector/luvus/contract/compiler-worker.ts ]]; then
            bun --no-env-file scripts/release/native-smoke.mjs
            if [[ "$RUNNER_OS" == Windows ]]; then
              python scripts/release/verify-windows-icon.py dist/release/${{ matrix.target }}/probe/packaging-probe.exe
            fi
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Schema Worker factory pending; no schema runtime acceptance is claimed.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload real schema factory probe when accepted
        if: steps.native.outputs.present == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: native-contract-probe-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/release/${{ matrix.target }}/probe/packaging-probe*
            dist/release/${{ matrix.target }}/probe/manifest.json
      - name: Upload CLI preview candidate
        if: steps.product.outputs.present == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: cli-preview-candidate-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/release/${{ matrix.target }}/candidate/rovloom*
            dist/release/${{ matrix.target }}/candidate/manifest.json
      # 放在最后：打包会重新构建并清空 dist/，之前的候选产物必须已经上传。
      - name: Pack the npm tarball and run it from a clean bun add (CLI, bunx, Gateway start/stop)
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun --no-env-file -p 'JSON.parse(await Bun.file("package.json").text()).version')"
          bun --no-env-file scripts/release/npm-package.mjs "$RUNNER_TEMP/npm-package"
          bun --no-env-file scripts/release/npm-smoke.mjs "$RUNNER_TEMP/npm-package/rovloom-$version.tgz" "$version"
      - name: Report native phase observations
        if: always()
        continue-on-error: true
        shell: bash
        run: bun --no-env-file scripts/ci/test-observations.mjs "$RUNNER_TEMP/test-phases.log" "$RUNNER_TEMP/test-phases.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native phase observations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: parser-phases-${{ matrix.target }}
          path: ${{ runner.temp }}/test-phases.json
