# 仅响应用户创建的版本 tag；全门禁和真实产品验收完成后才组装草稿并一次公开。
name: Tagged product release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.tag.outputs.matrix }}
      artifactSet: ${{ steps.tag.outputs.artifactSet }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate exact tag, checkout and product/package version
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/release/validate.mjs
  quality:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/bun.yml
  preflight:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Require isolated real product HTTP/WebUI/Worker acceptance before matrix
        env:
          RELEASE_TARGET: bun-linux-x64
        run: bun --no-env-file scripts/release/package.mjs "$RUNNER_TEMP/product-preflight"
  build:
    needs: [validate, preflight]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Compile and accept real product on the native runner
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          # musl 目标在 glibc runner 上无法运行，验收改为一次性 Alpine 容器（先 apk add libstdc++）。
          ROVLOOM_MUSL_ALPINE: ${{ matrix.libc == 'musl' && '1' || '0' }}
        run: bun --no-env-file scripts/release/package.mjs "$RUNNER_TEMP/release-stage"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.validate.outputs.artifactSet }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-stage/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  npm:
    # 与二进制同一 tag 的 npm 包 tarball：先作 Release 资产，公开后由 publish job 发布到 npm 注册表。
    needs: [validate, preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Pack the tarball and accept it from a clean bun add
        run: |
          bun --no-env-file scripts/release/npm-package.mjs "$RUNNER_TEMP/release-npm"
          version="${GITHUB_REF_NAME#v}"
          bun --no-env-file scripts/release/npm-smoke.mjs "$RUNNER_TEMP/release-npm/rovloom-$version.tgz" "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.validate.outputs.artifactSet }}-npm
          path: ${{ runner.temp }}/release-npm/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: [validate, build, npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # GitHub Release 公开后把同一 tag 的 tarball 发布到 npm：npm ≥ 11.5.1 用 OIDC trusted publishing
      # 换取短期凭据并自动生成 provenance；工作流不持有任何长期 npm 秘密。npm 侧需预先把本工作流
      # 配置为 trusted publisher（首次发布前的准备见 docs/DISTRIBUTION.md）。
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Upgrade npm for OIDC trusted publishing (runner images ship older npm)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: release-${{ needs.validate.outputs.artifactSet }}-bun-*
          path: ${{ runner.temp }}/release-stage
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.validate.outputs.artifactSet }}-npm
          path: ${{ runner.temp }}/release-npm
      - name: Verify complete bytes, resume matching draft, then publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/release/publish.mjs "$RUNNER_TEMP/release-stage" "$RUNNER_TEMP/release-npm"