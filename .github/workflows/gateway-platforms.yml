# 独立验收纯 Gateway 文件层和真实单文件入口；不注册服务或放宽原生 Connector Owner。
name: Gateway platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: gateway-platforms-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
permissions:
  contents: read
jobs:
  gateway:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
          - runner: ubuntu-24.04
            target: bun-linux-x64-musl
            alpine: '1'
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64-musl
            alpine: '1'
          - runner: macos-15-intel
            target: bun-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
          - runner: windows-2025
            target: bun-windows-x64
          - runner: windows-11-arm
            target: bun-windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Verify ordinary files, schema provenance, atomic config, locks and unknown recovery
        run: bun --no-env-file test ./test/storage/file-platforms.test.ts ./test/storage/database-aliases.test.ts ./test/connector/herdr/gateway-schema.test.ts ./test/cli/config-init.test.ts
      - name: Verify Alpine container ownership and failure cleanup
        if: matrix.alpine == '1'
        env:
          ROVLOOM_DOCKER_TESTS: '1'
        run: bun --no-env-file test ./test/release/musl-lifecycle.test.mjs
      - name: Build actual standalone product
        env:
          # 矩阵目标决定编译产物；不传会让 musl 项编出 glibc 二进制再自我否定。
          TARGET: ${{ matrix.target }}
          # musl 产物只在 Alpine 容器内构建与运行；其余目标保持原生路径。
          ROVLOOM_MUSL_ALPINE: ${{ matrix.alpine || '0' }}
        run: bun --no-env-file run release:build
      - name: Run actual standalone and production Gateway twice with persistent state
        # musl 目标由 Alpine 容器步骤验收，宿主机无法加载 musl 加载器。
        if: matrix.alpine != '1'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable="$PWD/dist/release/$TARGET/candidate/rovloom"
          if [[ "$TARGET" == bun-windows-* ]]; then executable="$(cygpath -w "$executable.exe")"; fi
          export ROVLOOM_GATEWAY_EXECUTABLE="$executable"
          bun --no-env-file test ./test/release/gateway-platform.test.mjs
      - name: Run the musl Gateway twice inside an Alpine container
        if: matrix.alpine == '1'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable="$PWD/dist/release/$TARGET/candidate/rovloom"
          export ROVLOOM_GATEWAY_EXECUTABLE="$executable"
          export ROVLOOM_MUSL_ALPINE=1
          bun --no-env-file test ./test/release/gateway-platform.test.mjs
