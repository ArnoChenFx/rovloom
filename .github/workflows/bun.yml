# 在 Linux 上用最新稳定版 Bun 运行类型检查、lint、格式、测试与构建。
name: Bun verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: bun-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
permissions:
  contents: read
jobs:
  linux:
    name: linux (latest)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun --no-env-file run lint
      - run: bun --no-env-file run format:check
      - run: bun --no-env-file run typecheck
      - name: Test and capture phase observations
        shell: bash
        run: |
          set -o pipefail
          bun --no-env-file run test 2>&1 | tee "$RUNNER_TEMP/test-phases.log"
      - name: Report phase observations
        if: always()
        continue-on-error: true
        shell: bash
        run: bun --no-env-file scripts/ci/test-observations.mjs "$RUNNER_TEMP/test-phases.log" "$RUNNER_TEMP/test-phases.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload phase observations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-phases
          path: ${{ runner.temp }}/test-phases.json
      - run: bun --no-env-file run build
      - run: bun --no-env-file run smoke
      - name: Verify connector disconnect and reconnect with real Herdr
        timeout-minutes: 5
        env:
          LUVUS_TEST_ROOT: ${{ runner.temp }}
        run: bun --no-env-file scripts/e2e/connector-disconnect.mjs
      - name: Pack the npm tarball and run it from a clean bun add
        run: |
          version="$(bun --no-env-file -p 'JSON.parse(await Bun.file("package.json").text()).version')"
          bun --no-env-file scripts/release/npm-package.mjs "$RUNNER_TEMP/npm-package"
          bun --no-env-file scripts/release/npm-smoke.mjs "$RUNNER_TEMP/npm-package/rovloom-$version.tgz" "$version"
