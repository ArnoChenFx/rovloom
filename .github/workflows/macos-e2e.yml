# 真实 macOS runner 上的验收：libSystem 原语，以及后续阶段的 Connector 附着官方 Herdr / Luvus。
name: macOS e2e
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: macos-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        run: bun --no-env-file scripts/ci/e2e-plan.mjs macos
  platform:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 10
    name: platform (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: macOS platform primitives (peer credentials, process facts)
        run: bun --no-env-file test ./test/platform/macos.test.ts
      - name: Attach to a running Herdr / Luvus (peer proof, process image identity, crash recovery)
        run: bun --no-env-file test ./test/connector/herdr/attach.test.ts ./test/runtime/native-attach-macos.test.ts ./test/runtime/native-crash-recovery.test.ts
  quickstart:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 25
    name: quickstart (${{ matrix.runner }}, ${{ matrix.scenario }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        scenario: [first-run, connector-crash, second-device, repair, boot-service]
        include:
          - scenario: first-run
            flags: ''
          - scenario: connector-crash
            flags: --crash
          - scenario: second-device
            flags: --second-device
          - scenario: repair
            flags: --repair
          - scenario: boot-service
            flags: --service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Download official Herdr (macOS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          arch="$(uname -m)"; suffix="$([ "$arch" = arm64 ] && echo aarch64 || echo x86_64)"
          mkdir -p "$RUNNER_TEMP/herdr"
          gh release download v0.9.5 -R herdrdev/herdr -p "herdr-macos-$suffix" -D "$RUNNER_TEMP/herdr"
          chmod +x "$RUNNER_TEMP/herdr/herdr-macos-$suffix"
          echo "HERDR_BIN=$RUNNER_TEMP/herdr/herdr-macos-$suffix" >> "$GITHUB_ENV"
          echo "TARGET=bun-darwin-$([ "$arch" = arm64 ] && echo arm64 || echo x64)" >> "$GITHUB_ENV"
      - name: Build actual standalone product
        run: bun --no-env-file run release:build
      - name: Quick Start on macOS (real pty pairing, attach to real Herdr, MCP chain)
        run: python3 e2e/quickstart.py --binary "dist/release/$TARGET/candidate/rovloom" --herdr "$HERDR_BIN" ${{ matrix.flags }} --then "bun --no-env-file e2e/herdr-session.mjs"
  luvus:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 25
    name: luvus (${{ matrix.runner }}, ${{ matrix.scenario }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        scenario: [first-run, attach-existing, connector-crash, luvus-killed, legacy-wait-output]
        include:
          - scenario: first-run
            flags: ''
          - scenario: attach-existing
            flags: --pre-existing
          - scenario: connector-crash
            flags: --crash
          - scenario: luvus-killed
            flags: --pre-existing --kill-luvus
          - scenario: legacy-wait-output
            flags: --legacy-wait-output
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Download official Luvus (macOS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          arch="$(uname -m)"; suffix="$([ "$arch" = arm64 ] && echo aarch64 || echo x86_64)"
          mkdir -p "$RUNNER_TEMP/luvus"
          gh release download v0.14.3 -R RizRiyz/luvus -p "luvus-v0.14.3-$suffix-apple-darwin.tar.gz" -D "$RUNNER_TEMP/luvus"
          tar xzf "$RUNNER_TEMP/luvus/luvus-v0.14.3-$suffix-apple-darwin.tar.gz" -C "$RUNNER_TEMP/luvus"
          echo "LUVUS_BIN=$(find "$RUNNER_TEMP/luvus" -type f -name luvus | head -1)" >> "$GITHUB_ENV"
          echo "TARGET=bun-darwin-$([ "$arch" = arm64 ] && echo arm64 || echo x64)" >> "$GITHUB_ENV"
      - name: Build actual standalone product
        run: bun --no-env-file run release:build
      - name: Quick Start on macOS with Luvus (real pty pairing, attach to real Luvus, MCP chain)
        env:
          LUVUS_WRITE: '{}'
        run: python3 e2e/quickstart.py --binary "dist/release/$TARGET/candidate/rovloom" --luvus "$LUVUS_BIN" ${{ matrix.flags }} --then "bun --no-env-file e2e/luvus-session.mjs"
  result:
    name: macos acceptance
    if: always()
    needs: [changes, platform, quickstart, luvus]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        continue-on-error: true
      # 分段计时只作观测：continue-on-error 保证它失败时验收结论照常由下一步决定。
      - name: Report job timing segments
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun --no-env-file scripts/ci/github-read.mjs "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/run.json"
          bun --no-env-file scripts/ci/github-read.mjs "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          bun --no-env-file scripts/ci/job-timing.mjs "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/run.json" | tee "$RUNNER_TEMP/timing.md"
          cat "$RUNNER_TEMP/timing.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Require selected acceptance to succeed
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('e2e plan failed')
          selected = results['changes']['outputs'].get('run') == 'true'
          expected = 'success' if selected else 'skipped'
          if any(value['result'] != expected for key, value in results.items() if key != 'changes'):
              raise SystemExit('selected e2e acceptance did not succeed')
          print('e2e acceptance passed' if selected else 'no relevant changes')
          PY
